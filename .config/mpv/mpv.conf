# ==============================================================================
# MPV CONFIGURATION FILE (mpv.conf)
# Optimized for High-Quality Playback & Usability
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Track & Language Defaults (User Request)
# ------------------------------------------------------------------------------
alang=jpn,eng,ko       # Priority list for audio languages
slang=ja,eng,en        # Priority list for subtitle languages
sid=1                  # Display first subtitle track by default
# sid=no               # Alternative: Uncomment to disable subtitles by default
# aid=1                # Alternative: Force audio track 1

# ------------------------------------------------------------------------------
# 2. General & Video Settings
# ------------------------------------------------------------------------------
vo=gpu-next            # Recommended video output driver
gpu-api=opengl         # Use OpenGL as the GPU API
# profile=gpu-hq       # High-quality rendering profile preset
hwdec=auto             # Hardware decoding (safe methods only)
keep-open=yes          # Do not close the player after video ends
save-position-on-quit=yes # Resume playback from where you left off
keepaspect=yes         # Preserve aspect ratio
keepaspect-window=no   # Disable aspect ratio preservation in fullscreen
autocreate-playlist=same # Create playlist automatically from the same directory

# ------------------------------------------------------------------------------
# 3. Audio & Subtitle Behavior
# ------------------------------------------------------------------------------
volume=100             # Default startup volume
volume-max=100         # Max amplification level
audio-file-auto=exact  # Load external audio files with matching names
af="acompressor=threshold=-24dB:ratio=4:attack=20:release=250:makeup=6dB"
sub-auto=all           # Load any external subtitle file in the folder
sub-font="sans-serif"  # Change default subtitle font
sub-font-size=40       # Base font size
sub-color="#FFFFFFFF"  # White text
sub-border-size=2      # Black border size

# ------------------------------------------------------------------------------
# 4. Interface & OSD (On-Screen Display)
# ------------------------------------------------------------------------------
osc=no                 # Enable the default On-Screen Controller
osd-font="sans-serif"  # OSD font
osd-font-size=30       # OSD font size
osd-bar=no             # Visual progress bar during seeks
window-dragging=no     # Disable window dragging
