# Mouse bindings
MBTN_LEFT        cycle pause
MBTN_LEFT_DBL    cycle fullscreen

# Arrow bindings
UP		 ignore
DOWN		 ignore
RIGHT            no-osd seek 5 exact
LEFT             no-osd seek -5 exact

# Shift + Arrows to change playlist files
Shift+RIGHT      playlist-next
Shift+LEFT       playlist-prev

# Page Up/Down for chapters (Your custom preference)
PGDWN            add chapter 1
PGUP             add chapter -1
